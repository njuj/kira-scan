[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kira-scan"
dynamic = ["version"]
description = "Zero-dependency static malware triage: hashes, entropy, PE anomalies, IOC extraction and signature rules."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "kira", email = "286490266+njuj@users.noreply.github.com" }]
keywords = ["malware", "security", "dfir", "triage", "pe", "ioc", "blue-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/njuj/kira-scan"

[project.scripts]
kira-scan = "kirascan.cli:main"

[tool.setuptools.dynamic]
version = { attr = "kirascan.__version__" }

[tool.setuptools.packages.find]
include = ["kirascan*"]

[tool.setuptools.package-data]
kirascan = ["rules/*.json"]
